<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
  <div class="page-header">
    <h2>Historial de cajas</h2>
  </div>

  <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

  <div class="card" th:if="${!cajas.isEmpty()}">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Mis cajas</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
          <tr>
            <th>Fecha</th>
            <th>Unidad</th>
            <th>Monto total</th>
            <th>Estado</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="caja : ${cajas}">
            <td th:text="${#temporals.format(caja.fecha, 'dd/MM/yyyy')}"></td>
            <td th:text="${caja.unidadVenta}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(caja.montoTotal, 1, 'POINT', 2, 'COMMA')}"></td>
            <td>
                            <span class="badge"
                                  th:classappend="${caja.estado == 'ABIERTA'} ? 'bg-success badge-success' : 'bg-secondary badge-secondary'"
                                  th:text="${caja.estado}"></span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <h5 class="mt-3 mb-0">
        Total recaudado:
        <span th:text="${'$' + #numbers.formatDecimal(totalRecaudado, 1, 'POINT', 2, 'COMMA')}"></span>
      </h5>
    </div>
  </div>

  <div class="alert alert-info" th:if="${cajas.isEmpty() and error == null}">
    Todavía no tenés cajas registradas.
  </div>

  <a th:href="@{/empleado}" class="btn btn-outline-secondary mt-3">Volver</a>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
