<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
  <div class="page-header">
    <h2>Pedidos de hoy</h2>
  </div>

  <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

  <div class="card" th:if="${!pedidos.isEmpty()}">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Pedidos registrados en mi unidad</h5>
    </div>
    <div class="card-body">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>Pedido</th>
          <th>Detalle</th>
          <th>Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pedido : ${pedidos}">
          <td th:text="|#${pedido.id}|"></td>
          <td>
            <ul class="mb-0 pl-3">
              <li th:each="linea : ${pedido.detalle}" th:text="${linea}"></li>
            </ul>
          </td>
          <td th:text="${'$' + #numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
      </table>
      <h5 class="mt-3 mb-0">
        Total del día:
        <span th:text="${'$' + #numbers.formatDecimal(totalDelDia, 1, 'POINT', 2, 'COMMA')}"></span>
      </h5>
    </div>
  </div>

  <div class="alert alert-info" th:if="${pedidos.isEmpty() and error == null}">
    Todavía no se registraron pedidos hoy.
  </div>

  <div class="mt-3">
    <a th:href="@{/empleado/pedidos/new}" class="btn btn-success mr-2">Nuevo pedido</a>
    <a th:href="@{/empleado}" class="btn btn-outline-secondary">Volver</a>
  </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
