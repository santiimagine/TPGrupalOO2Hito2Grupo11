<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="hero-section text-center">
        <div class="container">
            <h1>Platos dados de baja</h1>
            <p class="mb-4">Platos de tu unidad que ya no están en el menú. Podés reactivarlos.</p>
        </div>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-info" th:if="${festivales == null or festivales.isEmpty()}">
        No tenés unidades de venta registradas.
    </div>

    <div class="card mb-4" th:if="${festivales != null and !festivales.isEmpty()}">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Festival</h5>
        </div>
        <div class="card-body">
            <form class="form-inline" method="get" th:action="@{/responsable/platos/bajas}">
                <select class="form-control mr-2" name="festivalId">
                    <option th:each="f : ${festivales}" th:value="${f.id}" th:text="${f.nombre}"
                            th:selected="${f.id == festivalId}"></option>
                </select>
                <button type="submit" class="btn btn-dark">Ver</button>
            </form>
        </div>
    </div>

    <div class="card" th:if="${platos != null}">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Platos dados de baja</h5>
            <a class="btn btn-sm btn-light" th:href="@{/responsable/platos(festivalId=${festivalId})}">Volver al menú</a>
        </div>
        <div class="card-body">
            <div class="table-responsive" th:if="${!platos.isEmpty()}">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th class="text-right">Precio de venta</th>
                        <th class="text-right">Costo de producción</th>
                        <th class="text-right">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="plato : ${platos}">
                        <td th:text="${plato.nombre}"></td>
                        <td class="text-right" th:text="|$ ${#numbers.formatDecimal(plato.precioVenta, 1, 'POINT', 2, 'COMMA')}|"></td>
                        <td class="text-right" th:text="|$ ${#numbers.formatDecimal(plato.costoProduccion, 1, 'POINT', 2, 'COMMA')}|"></td>
                        <td class="text-right">
                            <form class="d-inline" method="post" th:action="@{/responsable/platos/{id}/reactivar(id=${plato.id})}">
                                <input type="hidden" name="festivalId" th:value="${festivalId}"/>
                                <button type="submit" class="btn btn-sm btn-outline-success">Reactivar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="alert alert-info mb-0" th:if="${platos.isEmpty()}">
                No tenés platos dados de baja en este festival.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
