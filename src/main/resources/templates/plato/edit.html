<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
    <div class="hero-section text-center">
        <div class="container">
            <h1>Modificar plato</h1>
            <p class="mb-4">Cambiá los datos del plato en el menú de tu unidad</p>
        </div>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Datos del plato</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/responsable/platos/{id}/modificar(id=${platoId})}" th:object="${plato}" method="post">
                <input type="hidden" name="festivalId" th:value="${festivalId}"/>
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" maxlength="100"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                </div>
                <div class="form-group">
                    <label for="precioVenta">Precio de venta ($)</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="precioVenta" th:field="*{precioVenta}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></small>
                </div>
                <div class="form-group">
                    <label for="costoProduccion">Costo de producción ($)</label>
                    <input type="number" step="0.01" min="0" class="form-control" id="costoProduccion" th:field="*{costoProduccion}"/>
                    <small class="text-danger" th:if="${#fields.hasErrors('costoProduccion')}" th:errors="*{costoProduccion}"></small>
                </div>
                <button type="submit" class="btn btn-dark">Guardar cambios</button>
                <a class="btn btn-outline-dark" th:href="@{/responsable/platos(festivalId=${festivalId})}">Cancelar</a>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
