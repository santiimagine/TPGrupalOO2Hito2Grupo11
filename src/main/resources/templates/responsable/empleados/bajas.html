<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container py-4">
  <div class="page-header">
    <h2>Empleados dados de baja</h2>
  </div>

  <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

  <div class="card" th:if="${!empleados.isEmpty()}">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">Empleados inactivos</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead>
          <tr>
            <th>Apellido y nombre</th>
            <th>DNI</th>
            <th>Mail</th>
            <th>Tipo</th>
            <th>Categoría / turno</th>
            <th style="min-width: 280px;">Unidades</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="empleado : ${empleados}">
            <td th:text="|${empleado.apellido}, ${empleado.nombre}|"></td>
            <td th:text="${empleado.dni}"></td>
            <td th:text="${empleado.mail}"></td>
            <td th:text="${empleado.tipo}"></td>
            <td th:text="${empleado.detalle}"></td>
            <td>
              <ul class="mb-0 pl-3">
                <li class="text-nowrap" th:each="unidad : ${empleado.unidades}" th:text="${unidad}"></li>
              </ul>
            </td>
            <td class="text-nowrap">
              <form th:action="@{/responsable/empleados/{id}/reactivar(id=${empleado.id})}"
                    method="post" class="d-inline"
                    th:data-nombre="|${empleado.nombre} ${empleado.apellido}|"
                    onsubmit="return confirm('¿Reactivar a ' + this.dataset.nombre + '?');">
                <button type="submit" class="btn btn-sm btn-outline-success">Reactivar</button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="alert alert-info" th:if="${empleados.isEmpty()}">
    No tenés empleados dados de baja.
  </div>

  <a th:href="@{/responsable/empleados}" class="btn btn-outline-secondary mt-3">Volver a empleados</a>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
